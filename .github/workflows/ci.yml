name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: unpacked-extension
          path: |
            dist/*.zip
            dist/SHA256SUMS

name: Something isn't working
description: Report an installation, recording, or display problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Check [common fixes](https://github.com/vibhor1102/monkeytype-local-analytics/blob/main/docs/TROUBLESHOOTING.md) first. Don't attach private backups, browser profiles, or account details."
  - type: input
    id: versions
    attributes:
      label: Your setup
      description: Operating system, browser version, and extension version.
      placeholder: "For example: Fedora Linux, Chrome 157, extension 1.4.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we repeat it?
      description: Include the test mode or settings if recording is affected.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Collection message or screenshot (optional)
      description: Click the collection indicator in Typing mistakes for its message. Hide personal details in screenshots.

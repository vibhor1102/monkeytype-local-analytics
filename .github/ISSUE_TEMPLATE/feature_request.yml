name: Suggest an improvement
description: Explain a problem and how the extension could help.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Tell us what is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
      description: Describe the change and who it would help.
    validations:
      required: true
